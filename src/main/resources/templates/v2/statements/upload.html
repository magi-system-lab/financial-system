<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{single.title})}"></head>
<body class="app">
<div th:replace="~{layout/app :: nav}"></div>
<main class="app-main">
    <div class="nav-bar">
        <a class="btn btn-glass btn-icon" th:href="@{/ui/debt-accounts/{c}(c=${debtAccountCode})}" th:aria-label="#{common.back}">
            <svg th:replace="~{layout/app :: icon('chevron-left', '')}"></svg>
        </a>
        <span class="nav-bar-title" th:text="${account != null ? account.name : debtAccountCode}">Visa Oro</span>
        <span style="width: 44px"></span>
    </div>
    <div class="title-block">
        <div>
            <h1 class="large-title" th:text="#{single.title}">Import statement</h1>
            <p class="subtitle" th:if="${account != null and account.accountStatementType != null}"
               th:text="#{single.parser(${account.accountStatementType})}">Read as BBVA</p>
        </div>
    </div>

    <div class="notice notice-warn" role="alert" th:if="${extractionError != null and needsPdfPassword == true}" style="flex-direction: column; gap: 4px">
        <strong th:text="${extractionError}">The PDF is password protected</strong>
        <span class="small" th:text="#{single.needsPassword}">Enter the PDF’s password and upload again.</span>
    </div>
    <div class="notice notice-error" role="alert" th:if="${extractionError != null and needsPdfPassword != true}" style="flex-direction: column">
        <strong th:text="#{single.failed}">The statement couldn’t be read</strong>
        <pre class="code-block" id="extract-error" style="background: transparent; padding: 0" th:text="${extractionError}">error</pre>
        <span class="small" th:text="#{single.failedHelp}">The Activity log has the full details.</span>
        <button type="button" class="btn btn-tinted btn-sm" style="align-self: flex-start" data-copy-target="#extract-error">
            <span th:text="#{payments.copy}" th:attr="data-copied-text=#{activity.copied}">Copy error</span>
        </button>
    </div>

    <form th:action="@{/ui/v2/statements/{code}/extract(code=${debtAccountCode})}" method="post" enctype="multipart/form-data"
          class="card form-stack">
        <div>
            <label class="field-label" for="file" th:text="#{single.file}">Statement file</label>
            <input class="field" type="file" id="file" name="file" required accept=".pdf,.xlsx,.xls,.csv">
            <span class="small muted" th:text="#{single.fileHelp}">PDF, Excel or CSV</span>
        </div>
        <div>
            <label class="field-label" for="pdfPassword" th:text="#{single.password}">PDF password</label>
            <input class="field" type="password" id="pdfPassword" name="pdfPassword" autocomplete="off"
                   th:autofocus="${needsPdfPassword == true}">
            <span class="small muted" th:text="#{single.passwordHelp}">Only if the PDF is locked.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" th:text="#{single.preview}">Preview changes</button>
    </form>

    <section class="section">
        <h2 class="list-header" th:text="#{single.howTitle}">What you’ll see</h2>
        <div class="list">
            <div class="list-row"><span class="list-row-body"><span class="chip chip-green" th:text="#{diff.new}">New</span><span class="small muted" th:text="#{single.howNew}">…</span></span></div>
            <div class="list-row"><span class="list-row-body"><span class="chip chip-blue" th:text="#{diff.updated}">Updated</span><span class="small muted" th:text="#{single.howUpdated}">…</span></span></div>
            <div class="list-row"><span class="list-row-body"><span class="chip chip-orange" th:text="#{diff.completed}">Paid off</span><span class="small muted" th:text="#{single.howCompleted}">…</span></span></div>
            <div class="list-row"><span class="list-row-body"><span class="chip chip-gray" th:text="#{diff.unchanged}">Unchanged</span><span class="small muted" th:text="#{single.howUnchanged}">…</span></span></div>
        </div>
    </section>
</main>
</body>
</html>
