<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{single.reviewTitle})}"></head>
<body class="app">
<div th:replace="~{layout/app :: nav}"></div>
<main class="app-main">
    <div class="nav-bar">
        <a class="btn btn-glass btn-icon" th:href="@{/ui/v2/statements/{c}(c=${debtAccountCode})}" th:aria-label="#{common.back}">
            <svg th:replace="~{layout/app :: icon('chevron-left', '')}"></svg>
        </a>
        <span></span>
        <span style="width: 44px"></span>
    </div>
    <div class="title-block">
        <div>
            <h1 class="large-title" th:text="#{single.reviewTitle}">Review changes</h1>
            <p class="subtitle" th:text="#{review.parser(${diff.parserUsed()})}">Read as BBVA</p>
        </div>
    </div>

    <div class="chips">
        <span class="chip chip-green" th:text="#{review.new(${diff.newDebts().size()})}">2 new</span>
        <span class="chip chip-blue" th:text="#{review.updated(${diff.updatedDebts().size()})}">5 updated</span>
        <span class="chip chip-orange" th:text="#{review.completed(${diff.completedDebts().size()})}">1 completed</span>
        <span class="chip chip-gray" th:text="#{review.unchanged(${diff.unchangedDebts().size()})}">3 unchanged</span>
        <span class="chip chip-gray" th:unless="${diff.ignoredDebts().isEmpty()}" th:text="#{review.ignored(${diff.ignoredDebts().size()})}">1 ignored</span>
    </div>

    <div th:replace="~{fragments/upcoming-reminder :: reminder(${upcomingDebts}, ${'/ui/v2/statements/' + debtAccountCode + '/preview'})}"></div>

    <div class="notice notice-error" role="alert" th:if="${syncError != null}" style="flex-direction: column">
        <strong th:text="#{single.syncFailed}">Applying failed</strong>
        <pre class="code-block" id="sync-error" style="background: transparent; padding: 0" th:text="${syncError}">error</pre>
        <button type="button" class="btn btn-tinted btn-sm" style="align-self: flex-start" data-copy-target="#sync-error">
            <span th:text="#{payments.copy}" th:attr="data-copied-text=#{activity.copied}">Copy error</span>
        </button>
    </div>

    <div class="notice notice-info" th:if="${diff.isEmpty()}" th:text="#{single.noChanges}">No changes.</div>

    <div class="list" th:unless="${diff.isEmpty() and diff.ignoredDebts().isEmpty()}">
        <th:block th:replace="~{fragments/statement-diff :: rows(${diff}, @{/ui/v2/statements/{c}/mark-ignorable(c=${debtAccountCode})})}"></th:block>
    </div>
    <p class="list-footer"><a th:href="@{/ui/ignorable-debts}" th:text="#{single.manageIgnored}">Ignored debts</a></p>

    <div class="form-stack" th:unless="${diff.isEmpty()}">
        <form th:action="@{/ui/v2/statements/{c}/sync(c=${debtAccountCode})}" method="post">
            <input type="hidden" name="mode" value="UPDATE">
            <button type="submit" class="btn btn-primary btn-block" th:text="#{single.applyUpdate}">Apply update</button>
        </form>
        <form th:action="@{/ui/v2/statements/{c}/sync(c=${debtAccountCode})}" method="post" th:attr="data-confirm=#{single.rebuildConfirm}">
            <input type="hidden" name="mode" value="SOURCE_OF_TRUTH">
            <button type="submit" class="btn btn-danger btn-block" th:text="#{single.rebuild}">Rebuild from 0</button>
        </form>
        <a class="btn btn-plain btn-block" th:href="@{/ui/debt-accounts/{c}(c=${debtAccountCode})}" th:text="#{common.cancel}">Cancel</a>
    </div>
    <a class="btn btn-tinted btn-block" th:if="${diff.isEmpty()}" th:href="@{/ui/debt-accounts/{c}(c=${debtAccountCode})}" th:text="#{single.backToCard}">Back to card</a>
</main>

<dialog th:replace="~{fragments/statement-diff :: ignoreSheet(@{/ui/v2/statements/{c}/mark-ignorable(c=${debtAccountCode})})}"></dialog>
</body>
</html>
