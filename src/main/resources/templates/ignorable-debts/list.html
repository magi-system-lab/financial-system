<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{ignored.title})}"></head>
<body class="app">
<div th:replace="~{layout/app :: nav}"></div>
<main class="app-main">
    <div class="nav-bar">
        <a class="btn btn-glass btn-icon" th:href="@{/ui/more}" th:aria-label="#{common.back}">
            <svg th:replace="~{layout/app :: icon('chevron-left', '')}"></svg>
        </a>
        <span></span>
        <button type="button" class="btn btn-glass btn-icon" data-open-sheet="add-sheet" th:aria-label="#{ignored.add}">
            <svg th:replace="~{layout/app :: icon('plus', '')}"></svg>
        </button>
    </div>
    <div class="title-block">
        <div>
            <h1 class="large-title" th:text="#{ignored.title}">Ignored debts</h1>
            <p class="subtitle" th:text="#{ignored.subtitle}">Skipped automatically on every statement import.</p>
        </div>
    </div>

    <div class="list" th:unless="${ignorableDebts.isEmpty()}">
        <div class="list-row" th:each="ig : ${ignorableDebts}">
            <span class="row-icon bg-gray"><svg th:replace="~{layout/app :: icon('eye-off', '')}"></svg></span>
            <span class="list-row-body">
                <span class="list-row-title">
                    <span th:text="${ig.reason}">Borrowed by a relative</span>
                    <span><span class="mono" th:title="${ig.hashSum}" th:text="${#strings.abbreviate(ig.hashSum, 15)}">3f2a9c0b1d4e…</span><th:block
                          th:if="${ig.createdAt != null}" th:text="${' · ' + #messages.msg('ignored.since', #temporals.format(ig.createdAt, 'd MMM yyyy'))}"> · Since 3 Oct 2026</th:block></span>
                </span>
                <form th:action="@{/ui/ignorable-debts/{h}(h=${ig.hashSum})}" method="post" th:attr="data-confirm=#{ignored.removeConfirm}">
                    <input type="hidden" name="_method" value="DELETE">
                    <button type="submit" class="btn btn-plain btn-sm" th:text="#{ignored.remove}">Stop ignoring</button>
                </form>
            </span>
        </div>
    </div>

    <div class="card" th:if="${ignorableDebts.isEmpty()}">
        <div class="empty">
            <svg th:replace="~{layout/app :: icon('eye-off', '')}"></svg>
            <span th:text="#{ignored.empty}">No ignored debts.</span>
        </div>
    </div>
</main>

<dialog class="sheet" id="add-sheet" th:aria-label="#{ignored.add}">
    <form th:action="@{/ui/ignorable-debts}" method="post">
        <div class="sheet-head">
            <button type="button" class="btn btn-plain btn-sm" data-close-sheet th:text="#{common.cancel}">Cancel</button>
            <strong th:text="#{ignored.add}">Ignore a debt</strong>
            <button type="submit" class="btn btn-plain btn-sm" style="font-weight: 700" th:text="#{common.add}">Add</button>
        </div>
        <div class="sheet-body form-stack">
            <div>
                <label class="field-label" for="i-hash" th:text="#{ignored.hash}">Hash</label>
                <input class="field mono" id="i-hash" name="hashSum" required minlength="64" maxlength="64" autocomplete="off" spellcheck="false">
                <p class="list-footer" style="padding: 6px 0 0" th:text="#{ignored.hashHelp}">64-character SHA-256 hash.</p>
            </div>
            <div>
                <label class="field-label" for="i-reason" th:text="#{ignored.reason}">Reason</label>
                <input class="field" id="i-reason" name="reason" required th:placeholder="#{ignored.reasonPlaceholder}">
            </div>
        </div>
    </form>
</dialog>
</body>
</html>
