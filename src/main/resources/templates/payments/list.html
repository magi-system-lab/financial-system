<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{payments.title})}"></head>
<body class="app">
<div th:replace="~{layout/app :: nav}"></div>
<main class="app-main">
    <div class="nav-bar">
        <a class="btn btn-glass btn-icon" th:href="@{/ui/debt-accounts/{c}(c=${debtAccountCode})}" th:aria-label="#{common.back}">
            <svg th:replace="~{layout/app :: icon('chevron-left', '')}"></svg>
        </a>
        <span class="nav-bar-title" th:text="${account != null ? account.name : debtAccountCode}">BBVA Azul</span>
        <span style="width: 44px"></span>
    </div>
    <div class="title-block">
        <div><h1 class="large-title" th:text="#{payments.title}">Payments</h1></div>
    </div>

    <div class="notice notice-error" role="alert" th:if="${paymentError != null}" style="flex-direction: column">
        <strong th:text="#{payments.failed}">The payment couldn’t be recorded</strong>
        <pre class="code-block" id="payment-error" style="border-radius: 12px; background: transparent; padding: 0" th:text="${paymentError}">error</pre>
        <span class="small" th:text="#{payments.failedHelp}">Nothing was changed.</span>
        <span style="display: flex; gap: 8px">
            <button type="button" class="btn btn-tinted btn-sm" data-copy-target="#payment-error">
                <span th:text="#{payments.copy}" th:attr="data-copied-text=#{activity.copied}">Copy error</span>
            </button>
            <a class="btn btn-plain btn-sm" th:href="@{/ui/activity}" th:text="#{nav.activity}">Activity log</a>
        </span>
    </div>

    <form th:action="@{/ui/payments/{c}(c=${debtAccountCode})}" method="post" th:attr="data-confirm=#{card.recordConfirm}">
        <button type="submit" class="btn btn-primary btn-block">
            <svg th:replace="~{layout/app :: icon('check', 'ic-sm')}"></svg><span th:text="#{card.recordPayment}">Record payment</span>
        </button>
    </form>

    <div class="list" th:unless="${payments.isEmpty()}">
        <div class="list-row" th:each="p : ${payments}">
            <span class="row-icon bg-green"><svg th:replace="~{layout/app :: icon('check', '')}"></svg></span>
            <span class="list-row-body">
                <span class="list-row-title">
                    <span th:text="${p.createdAt != null} ? ${#temporals.format(p.createdAt, 'd MMMM yyyy')} : '—'">5 October 2026</span>
                    <span th:text="${p.createdAt != null} ? ${#temporals.format(p.createdAt, 'HH:mm')} : ''">10:32</span>
                </span>
                <span class="tabular" style="font-weight: 600" th:text="${@fmt.money(p.amountPaid)}">$4,773.75</span>
            </span>
        </div>
    </div>
    <div class="card" th:if="${payments.isEmpty()}">
        <div class="empty">
            <svg th:replace="~{layout/app :: icon('inbox', '')}"></svg>
            <span th:text="#{payments.empty}">No payments recorded yet.</span>
        </div>
    </div>
</main>
</body>
</html>
