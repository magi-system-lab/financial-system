<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{login.title})}"></head>
<body class="app">
<main class="login">
    <div class="login-card">
        <img class="app-icon" th:src="@{/img/icon-192.png}" alt="" width="84" height="84">
        <div style="text-align: center; display: flex; flex-direction: column; gap: 6px">
            <h1 class="large-title" th:text="#{app.name}">Financial Manager</h1>
            <p class="subtitle" th:text="#{login.subtitle}">Enter your email to open your finances.</p>
        </div>

        <div class="notice notice-warn" role="alert"
             th:if="${param.error != null and param.error[0] == 'email_not_found'}"
             th:text="#{login.notFound}">That email isn’t registered.</div>

        <form th:action="@{/ui/session}" method="post" data-clear-offline
              style="display: flex; flex-direction: column; gap: 14px">
            <div>
                <label for="email" class="field-label" th:text="#{login.email}">Email</label>
                <input type="email" id="email" name="email" class="field" placeholder="you@example.com"
                       autocomplete="email" autocapitalize="off" spellcheck="false" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-block" th:text="#{login.continue}">Continue</button>
        </form>

        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
            <a class="small" href="/swagger-ui.html" target="_blank" rel="noopener" th:text="#{login.api}">REST API docs</a>
            <div th:replace="~{layout/app :: langSwitch}"></div>
        </div>
    </div>
</main>
</body>
</html>
