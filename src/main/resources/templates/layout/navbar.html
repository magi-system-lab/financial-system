<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--
  Legacy pages (still on Bootstrap) include this fragment. It now renders the
  new navigation shell (layout/app :: nav) forced to light colours until each
  page is redesigned. The old Activity Log panel moved to /ui/activity.
-->
<div th:fragment="navbar" class="fm-legacy">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <div th:replace="~{layout/app :: nav}"></div>
    <script th:src="@{/js/app.js}" defer></script>
</div>
</body>
</html>
