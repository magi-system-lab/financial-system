<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{error.title})}"></head>
<body class="app">
<div th:replace="~{layout/app :: nav}"></div>
<main class="app-main">
    <div class="title-block">
        <div>
            <h1 class="large-title" th:text="#{error.title}">Something went wrong</h1>
            <p class="subtitle">
                <span th:text="#{error.body}">The full details were saved in the Activity log.</span>
                <a th:href="@{/ui/activity}" th:text="#{error.activity}">Activity log</a>
            </p>
        </div>
    </div>

    <section class="section">
        <h2 class="list-header" th:text="#{error.type}">Exception</h2>
        <pre class="code-block" th:text="${errorType}">UnknownError</pre>
    </section>
    <section class="section" th:if="${errorMessage != null}">
        <h2 class="list-header" style="display: flex; justify-content: space-between; align-items: center">
            <span th:text="#{error.message}">Message</span>
            <button type="button" class="btn btn-plain btn-sm" data-copy-target="#error-message"
                    th:attr="data-copied-text=#{activity.copied}" th:text="#{error.copy}">Copy</button>
        </h2>
        <pre class="code-block" id="error-message" th:text="${errorMessage}">message</pre>
    </section>
    <section class="section" th:if="${errorCause != null}">
        <h2 class="list-header" style="display: flex; justify-content: space-between; align-items: center">
            <span th:text="#{error.cause}">Caused by</span>
            <button type="button" class="btn btn-plain btn-sm" data-copy-target="#error-cause"
                    th:attr="data-copied-text=#{activity.copied}" th:text="#{error.copy}">Copy</button>
        </h2>
        <pre class="code-block" id="error-cause" th:text="${errorCause}">cause</pre>
    </section>

    <div class="actions-grid">
        <button type="button" class="btn btn-tinted" onclick="history.back()" th:text="#{error.back}">Go back</button>
        <a class="btn btn-primary" th:href="@{/ui/insights}" th:text="#{error.home}">Insights</a>
    </div>
</main>
</body>
</html>
