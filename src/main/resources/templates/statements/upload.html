<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{legacy.title})}"></head>
<body class="app">
<div th:replace="~{layout/app :: nav}"></div>
<main class="app-main">
    <div class="nav-bar">
        <a class="btn btn-glass btn-icon" th:href="@{/ui/debt-accounts/{c}(c=${debtAccountCode})}" th:aria-label="#{common.back}">
            <svg th:replace="~{layout/app :: icon('chevron-left', '')}"></svg>
        </a>
        <span class="nav-bar-title" th:text="${account != null ? account.name : debtAccountCode}">Visa Oro</span>
        <span style="width: 44px"></span>
    </div>
    <div class="title-block">
        <div>
            <h1 class="large-title" th:text="#{legacy.title}">Older statement upload</h1>
            <p class="subtitle" th:text="#{legacy.help}">Pick the statement type for this file.</p>
        </div>
    </div>

    <div class="notice notice-error" role="alert" th:if="${extractionError != null}" style="flex-direction: column">
        <strong th:text="#{single.failed}">The statement couldn’t be read</strong>
        <pre class="code-block" id="extract-error" style="background: transparent; padding: 0" th:text="${extractionError}">error</pre>
        <button type="button" class="btn btn-tinted btn-sm" style="align-self: flex-start" data-copy-target="#extract-error">
            <span th:text="#{payments.copy}" th:attr="data-copied-text=#{activity.copied}">Copy error</span>
        </button>
    </div>

    <form th:action="@{/ui/statements/{code}/extract(code=${debtAccountCode})}" method="post" enctype="multipart/form-data"
          class="card form-stack">
        <div>
            <label class="field-label" for="file" th:text="#{single.file}">Statement file</label>
            <input class="field" type="file" id="file" name="file" required accept=".pdf,.xlsx,.xls,.csv">
            <span class="small muted" th:text="#{single.fileHelp}">PDF, Excel or CSV</span>
        </div>
        <div>
            <label class="field-label" for="type" th:text="#{legacy.type}">Statement type</label>
            <select class="field" id="type" name="accountStatementType" required>
                <option th:each="t : ${statementTypes}" th:value="${t}"
                        th:selected="${account != null and account.accountStatementType == t}"
                        th:text="${#strings.replace(t.name(), '_', ' ')}">BBVA</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block" th:text="#{legacy.extract}">Read statement</button>
    </form>
</main>
</body>
</html>
