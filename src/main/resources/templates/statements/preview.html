<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{legacy.reviewTitle})}"></head>
<body class="app">
<div th:replace="~{layout/app :: nav}"></div>

<!-- Unified form: every editable field carries form="previewForm"; the action buttons use formaction. -->
<form id="previewForm" th:action="@{/ui/statements/{code}/add(code=${debtAccountCode})}" method="post"></form>

<main class="app-main"
      th:with="hasMovements=${not (#lists.isEmpty(newDebts) and #lists.isEmpty(installmentUpdates) and #lists.isEmpty(completedDebts))}">
    <div class="nav-bar">
        <a class="btn btn-glass btn-icon" th:href="@{/ui/statements/{c}(c=${debtAccountCode})}" th:aria-label="#{common.back}">
            <svg th:replace="~{layout/app :: icon('chevron-left', '')}"></svg>
        </a>
        <span></span>
        <span style="width: 44px"></span>
    </div>
    <div class="title-block">
        <div><h1 class="large-title" th:text="#{legacy.reviewTitle}">Statement preview</h1></div>
    </div>

    <div class="chips">
        <span class="chip chip-gray" th:text="#{legacy.current(${#lists.size(currentDebts)})}">4 current</span>
        <span class="chip chip-green" th:unless="${#lists.isEmpty(newDebts)}" th:text="#{review.new(${#lists.size(newDebts)})}">2 new</span>
        <span class="chip chip-blue" th:unless="${#lists.isEmpty(installmentUpdates)}" th:text="#{review.updated(${#lists.size(installmentUpdates)})}">3 updated</span>
        <span class="chip chip-orange" th:unless="${#lists.isEmpty(completedDebts)}" th:text="#{review.completed(${#lists.size(completedDebts)})}">1 completed</span>
        <span class="chip chip-gray" th:if="${ignoredDebts != null and not #lists.isEmpty(ignoredDebts)}" th:text="#{review.ignored(${#lists.size(ignoredDebts)})}">1 ignored</span>
    </div>

    <!-- Mode -->
    <section class="section" id="modes"
             th:attr="data-help-new=#{legacy.modeNewHelp}, data-help-sync=#{legacy.modeSyncHelp}, data-help-sot=#{legacy.modeSotHelp}">
        <h2 class="list-header" th:text="#{legacy.mode}">Mode</h2>
        <div class="seg">
            <button type="button" data-mode="new" th:text="#{legacy.modeNew}">Load new</button>
            <button type="button" data-mode="sync" th:text="#{legacy.modeSync}">Sync</button>
            <button type="button" data-mode="sot" th:text="#{legacy.modeSot}">Replace all</button>
        </div>
        <p class="list-footer" id="modeDescription"></p>
    </section>

    <!-- Current debts (reference) -->
    <details class="list disclosure">
        <summary>
            <span class="list-row-body">
                <span class="list-row-title"><span th:text="#{legacy.currentDebts}">Current debts on this card</span></span>
                <span class="list-row-value" th:text="${#lists.size(currentDebts)}">4</span>
                <svg th:replace="~{layout/app :: icon('chevron-right', 'chevron')}"></svg>
            </span>
        </summary>
        <div class="list-row diff-row muted-row" th:each="d : ${currentDebts}">
            <span class="list-row-body">
                <span class="list-row-title" style="gap: 3px">
                    <span th:text="${d.description}">Laptop</span>
                    <span th:replace="~{fragments/statement-diff :: debtLine(${d}, ${d.maxFinancingTerm != null and d.maxFinancingTerm > 0 ? #messages.msg('card.installment', d.currentInstallment, d.maxFinancingTerm) : null})}"></span>
                </span>
                <th:block th:replace="~{fragments/statement-diff :: ignoreButton(${d}, @{/ui/statements/{c}/mark-ignorable(c=${debtAccountCode})})}"></th:block>
            </span>
        </div>
        <p class="small muted" style="padding: 12px 16px" th:if="${#lists.isEmpty(currentDebts)}" th:text="#{legacy.noCurrent}">No active debts yet.</p>
    </details>

    <section class="section">
        <h2 class="section-title" th:text="#{legacy.movements}">Statement movements</h2>

        <!-- New debts: editable, saved in "new" and "sync" modes -->
        <div class="list" id="tbody-new" hidden th:unless="${#lists.isEmpty(newDebts)}">
            <div class="diff-row" th:each="debt, it : ${newDebts}" th:id="${'row-' + it.index}" style="border-bottom: 0.5px solid var(--sep)">
                <div class="list-row">
                    <span class="list-row-body" style="border-bottom: 0">
                        <span class="chip chip-green" th:text="#{diff.new}">New</span>
                        <span class="list-row-title"></span>
                        <th:block th:replace="~{fragments/statement-diff :: ignoreButton(${debt}, @{/ui/statements/{c}/mark-ignorable(c=${debtAccountCode})})}"></th:block>
                        <button type="button" class="btn btn-tinted btn-sm" th:attr="data-row=${it.index}, data-excluded=#{legacy.excluded}"
                                onclick="removeDebtRow(this)" th:text="#{legacy.exclude}">Leave out</button>
                    </span>
                </div>
                <div class="edit-grid">
                    <label class="wide"><span th:text="#{debt.description}">Description</span>
                        <input class="field" form="previewForm" th:name="|debts[${it.index}].description|" th:value="${debt.description}"></label>
                    <label><span th:text="#{debt.monthly}">Monthly payment</span>
                        <input class="field tabular" type="number" step="0.01" form="previewForm" th:name="|debts[${it.index}].monthlyPayment|" th:value="${debt.monthlyPayment}"></label>
                    <label><span th:text="#{debt.original}">Original amount</span>
                        <input class="field tabular" type="number" step="0.01" form="previewForm" th:name="|debts[${it.index}].originalAmount|" th:value="${debt.originalAmount}"></label>
                    <label><span th:text="#{debt.current}">Installments paid</span>
                        <input class="field tabular" type="number" form="previewForm" th:name="|debts[${it.index}].currentInstallment|" th:value="${debt.currentInstallment}"></label>
                    <label><span th:text="#{debt.term}">Total installments</span>
                        <input class="field tabular" type="number" form="previewForm" th:name="|debts[${it.index}].maxFinancingTerm|" th:value="${debt.maxFinancingTerm}"></label>
                    <label><span th:text="#{debt.date}">Purchase date</span>
                        <input class="field" form="previewForm" placeholder="yyyy-MM-dd" th:name="|debts[${it.index}].operationDate|" th:value="${debt.operationDate}"></label>
                    <label><span th:text="#{debt.type}">Type</span>
                        <select class="field" form="previewForm" th:name="|debts[${it.index}].debtType|">
                            <option th:each="t : ${debtTypes}" th:value="${t}" th:selected="${t == debt.debtType}" th:text="#{${'debtType.' + t.name()}}">Card</option>
                        </select></label>
                </div>
            </div>
        </div>

        <!-- Installment updates: type can be overridden ("sync" mode) -->
        <div class="list" id="tbody-sync" hidden th:unless="${#lists.isEmpty(installmentUpdates)}">
            <div class="list-row diff-row" th:each="u, it : ${installmentUpdates}">
                <span class="list-row-body" style="flex-wrap: wrap">
                    <span class="list-row-title" style="gap: 3px">
                        <span th:text="${u.debt.description}">Laptop</span>
                        <span class="tabular" th:text="${u.previousInstallment + ' → ' + u.newInstallment + (u.debt.maxFinancingTerm != null ? ' / ' + u.debt.maxFinancingTerm : '') + (u.debt.monthlyPayment != null ? ' · ' + @fmt.money(u.debt.monthlyPayment) : '')}">3 → 4 / 12</span>
                    </span>
                    <span class="chip chip-blue" th:text="#{diff.updated}">Updated</span>
                    <input type="hidden" form="previewForm" th:name="|typeOverrides[${it.index}].hashSum|" th:value="${u.debt.hashSum}">
                    <select class="field" style="height: 36px; width: auto; font-size: 14px" form="previewForm" th:name="|typeOverrides[${it.index}].debtType|" th:aria-label="#{debt.type}">
                        <option th:each="t : ${debtTypes}" th:value="${t}" th:selected="${t == u.debt.debtType}" th:text="#{${'debtType.' + t.name()}}">Card</option>
                    </select>
                </span>
            </div>
        </div>

        <!-- Paid off: display only ("sync" mode) -->
        <div class="list" id="tbody-sync-done" hidden th:unless="${#lists.isEmpty(completedDebts)}">
            <div class="list-row diff-row" th:each="d : ${completedDebts}">
                <span class="list-row-body">
                    <span class="list-row-title" style="gap: 3px">
                        <span th:text="${d.description}">Phone</span>
                        <span th:replace="~{fragments/statement-diff :: debtLine(${d}, ${d.maxFinancingTerm != null ? d.maxFinancingTerm + ' / ' + d.maxFinancingTerm : null})}"></span>
                    </span>
                    <span class="chip chip-orange" th:text="#{diff.completed}">Paid off</span>
                </span>
            </div>
        </div>

        <!-- Replace all: every statement debt, type can be overridden ("sot" mode) -->
        <div class="list" id="tbody-sot" hidden th:if="${hasMovements}">
            <div class="list-row diff-row" th:each="d, s : ${newDebts}" th:with="idx=${s.index}">
                <span class="list-row-body" style="flex-wrap: wrap">
                    <span class="list-row-title" style="gap: 3px"><span th:text="${d.description}">TV</span>
                        <span th:replace="~{fragments/statement-diff :: debtLine(${d}, null)}"></span></span>
                    <input type="hidden" form="previewForm" th:name="|typeOverrides[${idx}].hashSum|" th:value="${d.hashSum}">
                    <select class="field" style="height: 36px; width: auto; font-size: 14px" form="previewForm" th:name="|typeOverrides[${idx}].debtType|" th:aria-label="#{debt.type}">
                        <option th:each="t : ${debtTypes}" th:value="${t}" th:selected="${t == d.debtType}" th:text="#{${'debtType.' + t.name()}}">Card</option>
                    </select>
                </span>
            </div>
            <div class="list-row diff-row" th:each="u, s : ${installmentUpdates}" th:with="idx=${#lists.size(newDebts) + s.index}">
                <span class="list-row-body" style="flex-wrap: wrap">
                    <span class="list-row-title" style="gap: 3px"><span th:text="${u.debt.description}">Laptop</span>
                        <span th:replace="~{fragments/statement-diff :: debtLine(${u.debt}, null)}"></span></span>
                    <input type="hidden" form="previewForm" th:name="|typeOverrides[${idx}].hashSum|" th:value="${u.debt.hashSum}">
                    <select class="field" style="height: 36px; width: auto; font-size: 14px" form="previewForm" th:name="|typeOverrides[${idx}].debtType|" th:aria-label="#{debt.type}">
                        <option th:each="t : ${debtTypes}" th:value="${t}" th:selected="${t == u.debt.debtType}" th:text="#{${'debtType.' + t.name()}}">Card</option>
                    </select>
                </span>
            </div>
            <div class="list-row diff-row" th:each="d, s : ${completedDebts}" th:with="idx=${#lists.size(newDebts) + #lists.size(installmentUpdates) + s.index}">
                <span class="list-row-body" style="flex-wrap: wrap">
                    <span class="list-row-title" style="gap: 3px"><span th:text="${d.description}">Phone</span>
                        <span th:replace="~{fragments/statement-diff :: debtLine(${d}, null)}"></span></span>
                    <input type="hidden" form="previewForm" th:name="|typeOverrides[${idx}].hashSum|" th:value="${d.hashSum}">
                    <select class="field" style="height: 36px; width: auto; font-size: 14px" form="previewForm" th:name="|typeOverrides[${idx}].debtType|" th:aria-label="#{debt.type}">
                        <option th:each="t : ${debtTypes}" th:value="${t}" th:selected="${t == d.debtType}" th:text="#{${'debtType.' + t.name()}}">Card</option>
                    </select>
                </span>
            </div>
        </div>

        <div class="card" th:if="${!hasMovements and (ignoredDebts == null or #lists.isEmpty(ignoredDebts))}">
            <p class="small muted" th:text="#{legacy.nothing}">No movements.</p>
        </div>

        <!-- Ignored: always visible -->
        <div class="list" id="tbody-ignored" th:if="${ignoredDebts != null and not #lists.isEmpty(ignoredDebts)}">
            <div class="list-row diff-row muted-row ignored" th:each="ig : ${ignoredDebts}">
                <span class="list-row-body">
                    <span class="list-row-title" style="gap: 3px">
                        <span th:text="${ig.debt.description}">Borrowed</span>
                        <span th:text="#{legacy.wontSave(${ig.reason})}">Won’t be saved — reason</span>
                    </span>
                    <span class="chip chip-gray" th:text="#{diff.ignored}">Ignored</span>
                </span>
            </div>
        </div>
    </section>

    <!-- Actions per mode -->
    <div class="form-stack">
        <button type="submit" form="previewForm" class="btn btn-primary btn-block" data-action-mode="new" hidden
                th:formaction="@{/ui/statements/{c}/add(c=${debtAccountCode})}" th:text="#{legacy.saveNew}">Save new debts</button>
        <button type="submit" form="previewForm" class="btn btn-primary btn-block" data-action-mode="sync" hidden
                th:formaction="@{/ui/statements/{c}/sync(c=${debtAccountCode})}"
                th:attr="data-confirm=#{legacy.fullSyncConfirm}" th:text="#{legacy.fullSync}">Full sync</button>
        <button type="submit" form="previewForm" class="btn btn-danger btn-block" data-action-mode="sot" hidden
                th:formaction="@{/ui/statements/{c}/replace(c=${debtAccountCode})}"
                th:attr="data-confirm=#{legacy.replaceConfirm}" th:text="#{legacy.replace}">Replace all</button>
        <a class="btn btn-plain btn-block" th:href="@{/ui/debt-accounts/{c}(c=${debtAccountCode})}" th:text="#{common.cancel}">Cancel</a>
    </div>
</main>

<dialog th:replace="~{fragments/statement-diff :: ignoreSheet(@{/ui/statements/{c}/mark-ignorable(c=${debtAccountCode})})}"></dialog>

<script th:inline="javascript">
(function () {
    var SECTIONS = ['tbody-new', 'tbody-sync', 'tbody-sync-done', 'tbody-sot'];
    var SHOW = {
        'new':  ['tbody-new'],
        'sync': ['tbody-new', 'tbody-sync', 'tbody-sync-done'],
        'sot':  ['tbody-sot']
    };
    var help = document.getElementById('modes').dataset;

    function setMode(mode) {
        SECTIONS.forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            var on = SHOW[mode].indexOf(id) >= 0;
            el.hidden = !on;
            el.querySelectorAll('input, select').forEach(function (i) { i.disabled = !on; });
        });
        // Rows the user left out stay out.
        document.querySelectorAll('.excluded input, .excluded select').forEach(function (i) { i.disabled = true; });
        document.querySelectorAll('[data-action-mode]').forEach(function (b) { b.hidden = b.dataset.actionMode !== mode; });
        document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
        document.getElementById('modeDescription').textContent = help['help' + mode.charAt(0).toUpperCase() + mode.slice(1)] || '';
    }

    window.removeDebtRow = function (btn) {
        var row = document.getElementById('row-' + btn.getAttribute('data-row'));
        if (!row) return;
        row.classList.add('excluded');
        row.querySelectorAll('input, select').forEach(function (el) { el.disabled = true; });
        btn.disabled = true;
        btn.textContent = btn.getAttribute('data-excluded');
    };

    document.querySelectorAll('[data-mode]').forEach(function (b) {
        b.addEventListener('click', function () { setMode(b.dataset.mode); });
    });

    var hasUpdates = /*[[${not #lists.isEmpty(installmentUpdates)}]]*/ false;
    var hasCompleted = /*[[${not #lists.isEmpty(completedDebts)}]]*/ false;
    setMode((hasUpdates || hasCompleted) ? 'sync' : 'new');
})();
</script>
</body>
</html>
