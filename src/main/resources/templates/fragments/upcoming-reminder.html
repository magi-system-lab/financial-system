<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--
  Reminder shown while reviewing a statement: the card's purchases still on the upcoming pile.
  Nothing is matched automatically — the user recognises the purchase and marks it as started.
  Params: upcoming (List<UpcomingDebt>), returnTo (UI path to come back to).
-->
<div th:fragment="reminder(upcoming, returnTo)" th:if="${upcoming != null and !upcoming.empty}"
     class="notice notice-warn" style="flex-direction: column; gap: 10px">
    <span th:text="#{upcoming.reminder(${upcoming.size()})}">This card has 1 purchase on your upcoming pile.</span>
    <div class="list" style="width: 100%">
        <div class="list-row" th:each="u : ${upcoming}">
            <span class="list-row-body">
                <span class="list-row-title">
                    <span th:text="${u.description}">TV Liverpool</span>
                    <span th:text="#{upcoming.line(${u.installments}, ${@fmt.money(u.monthlyPayment)}, ${u.firstPaymentLabel()})}">12 × $1,000.00 · first payment Jan 2027</span>
                </span>
                <form th:action="@{/ui/upcoming-debts/{id}/start(id=${u.id})}" method="post" style="margin: 0"
                      th:attr="data-confirm=#{upcoming.startedConfirm}">
                    <input type="hidden" name="returnTo" th:value="${returnTo}">
                    <button type="submit" class="btn btn-tinted btn-sm" th:text="#{upcoming.started}">It started</button>
                </form>
            </span>
        </div>
    </div>
</div>
</body>
</html>
