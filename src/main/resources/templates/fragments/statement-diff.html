<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--
  Statement diff pieces shared by the single-statement (v2) review and the bulk import review.
  - rows(diff, ignoreUrl): one list row per debt (new / updated / paid off / unchanged / ignored);
    the eye button opens #ignore-sheet posting to ignoreUrl.
  - missing(debts, rebuild): debts in the app that the statement doesn't list.
  - ignoreSheet(action): the "Ignore this debt" bottom sheet.
-->

<!-- "$1,250.00 · 3 of 12 · Card · 2026-05-01" -->
<span th:fragment="debtLine(d, installments)"
      th:text="${@fmt.money(d.monthlyPayment)
          + (installments != null ? ' · ' + installments : '')
          + (d.debtType != null ? ' · ' + #messages.msg('debtType.' + d.debtType.name()) : '')
          + (d.operationDate != null ? ' · ' + d.operationDate : '')}">$1,250.00 · 3 of 12</span>

<th:block th:fragment="ignoreButton(d, ignoreUrl)">
    <button type="button" class="icon-btn" data-open-sheet="ignore-sheet" th:if="${d.hashSum != null}"
            th:aria-label="${#messages.msg('diff.ignore') + ': ' + d.description}" th:title="#{diff.ignore}"
            th:attr="data-action=${ignoreUrl}, data-f-hash-sum=${d.hashSum}, data-f-desc=${d.description}">
        <svg th:replace="~{layout/app :: icon('eye-off', '')}"></svg>
    </button>
</th:block>

<th:block th:fragment="rows(diff, ignoreUrl)">
    <div class="list-row diff-row" th:each="e : ${diff.newDebts()}">
        <span class="list-row-body">
            <span class="list-row-title" style="gap: 3px">
                <span th:text="${e.extractedDebt.description}">New TV</span>
                <span th:replace="~{fragments/statement-diff :: debtLine(${e.extractedDebt}, ${#messages.msg('card.installment', e.extractedDebt.currentInstallment, e.extractedDebt.maxFinancingTerm)})}"></span>
            </span>
            <span class="chip chip-green" th:text="#{diff.new}">New</span>
            <th:block th:replace="~{fragments/statement-diff :: ignoreButton(${e.extractedDebt}, ${ignoreUrl})}"></th:block>
        </span>
    </div>
    <div class="list-row diff-row" th:each="e : ${diff.updatedDebts()}">
        <span class="list-row-body">
            <span class="list-row-title" style="gap: 3px">
                <span th:text="${e.extractedDebt.description}">Laptop</span>
                <span th:replace="~{fragments/statement-diff :: debtLine(${e.extractedDebt}, ${(e.existingDebt != null ? e.existingDebt.currentInstallment + ' → ' : '') + #messages.msg('card.installment', e.extractedDebt.currentInstallment, e.extractedDebt.maxFinancingTerm)})}"></span>
            </span>
            <span class="chip chip-blue" th:text="#{diff.updated}">Updated</span>
            <th:block th:replace="~{fragments/statement-diff :: ignoreButton(${e.extractedDebt}, ${ignoreUrl})}"></th:block>
        </span>
    </div>
    <div class="list-row diff-row" th:each="e : ${diff.completedDebts()}">
        <span class="list-row-body">
            <span class="list-row-title" style="gap: 3px">
                <span th:text="${e.extractedDebt.description}">Phone</span>
                <span th:replace="~{fragments/statement-diff :: debtLine(${e.extractedDebt}, ${#messages.msg('card.installment', e.extractedDebt.currentInstallment, e.extractedDebt.maxFinancingTerm)})}"></span>
            </span>
            <span class="chip chip-orange" th:text="#{diff.completed}">Paid off</span>
        </span>
    </div>
    <div class="list-row diff-row muted-row" th:each="e : ${diff.unchangedDebts()}">
        <span class="list-row-body">
            <span class="list-row-title" style="gap: 3px">
                <span th:text="${e.extractedDebt.description}">Fridge</span>
                <span th:replace="~{fragments/statement-diff :: debtLine(${e.extractedDebt}, ${#messages.msg('card.installment', e.extractedDebt.currentInstallment, e.extractedDebt.maxFinancingTerm)})}"></span>
            </span>
            <span class="chip chip-gray" th:text="#{diff.unchanged}">Unchanged</span>
            <th:block th:replace="~{fragments/statement-diff :: ignoreButton(${e.extractedDebt}, ${ignoreUrl})}"></th:block>
        </span>
    </div>
    <th:block th:unless="${diff.ignoredDebts().isEmpty()}">
        <div class="list-row" style="min-height: 36px"><span class="list-row-body small muted" style="padding-top: 8px; padding-bottom: 8px" th:text="#{diff.ignoredHeader}">Ignored</span></div>
        <div class="list-row diff-row muted-row ignored" th:each="e : ${diff.ignoredDebts()}">
            <span class="list-row-body">
                <span class="list-row-title" style="gap: 3px">
                    <span th:text="${e.extractedDebt.description}">Borrowed</span>
                    <span th:text="${e.ignoreReason != null ? e.ignoreReason : ''}">A relative’s purchase</span>
                </span>
                <span class="chip chip-gray" th:text="#{diff.ignored}">Ignored</span>
            </span>
        </div>
    </th:block>
</th:block>

<th:block th:fragment="missing(debts, rebuild)">
    <th:block th:unless="${debts == null or debts.isEmpty()}">
        <div class="list-row" style="min-height: 36px">
            <span class="list-row-body small muted" style="padding-top: 8px; padding-bottom: 8px"
                  th:text="${rebuild} ? #{diff.missingHeaderRebuild} : #{diff.missingHeaderKeep}">In the app but not on this statement</span>
        </div>
        <div class="list-row diff-row" th:each="d : ${debts}">
            <span class="list-row-body">
                <span class="list-row-title" style="gap: 3px">
                    <span th:text="${d.description}">Phantom charge</span>
                    <span th:replace="~{fragments/statement-diff :: debtLine(${d}, ${#messages.msg('card.installment', d.currentInstallment, d.maxFinancingTerm)})}"></span>
                </span>
                <span class="chip chip-purple" th:text="#{diff.missing}">Not in statement</span>
            </span>
        </div>
    </th:block>
</th:block>

<dialog th:fragment="ignoreSheet(action)" class="sheet" id="ignore-sheet" th:aria-label="#{diff.ignoreTitle}">
    <form method="post" th:action="${action}">
        <input type="hidden" name="hashSum">
        <div class="sheet-head">
            <button type="button" class="btn btn-plain btn-sm" data-close-sheet th:text="#{common.cancel}">Cancel</button>
            <strong th:text="#{diff.ignoreTitle}">Ignore this debt</strong>
            <button type="submit" class="btn btn-plain btn-sm" style="font-weight: 700" th:text="#{diff.ignoreSave}">Ignore</button>
        </div>
        <div class="sheet-body">
            <p class="subtitle" th:text="#{diff.ignoreHelp}">It will be left out of future reviews.</p>
            <div>
                <label class="field-label" for="ignore-desc" th:text="#{diff.ignoreDebt}">Debt</label>
                <input class="field" id="ignore-desc" name="desc" readonly>
            </div>
            <div>
                <label class="field-label" for="ignore-reason" th:text="#{diff.ignoreReason}">Reason</label>
                <input class="field" id="ignore-reason" name="reason" required autocomplete="off" th:placeholder="#{diff.ignoreReasonPlaceholder}">
            </div>
        </div>
    </form>
</dialog>
</body>
</html>
