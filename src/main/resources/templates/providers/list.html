<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{providers.title})}"></head>
<body class="app">
<div th:replace="~{layout/app :: nav}"></div>
<main class="app-main">
    <div class="nav-bar">
        <a class="btn btn-glass btn-icon" th:href="@{/ui/cards}" th:aria-label="#{common.back}">
            <svg th:replace="~{layout/app :: icon('chevron-left', '')}"></svg>
        </a>
        <span></span>
        <button type="button" class="btn btn-glass btn-icon" data-open-sheet="add-provider-sheet" th:aria-label="#{providers.add}">
            <svg th:replace="~{layout/app :: icon('plus', '')}"></svg>
        </button>
    </div>
    <div class="title-block">
        <div>
            <h1 class="large-title" th:text="#{providers.title}">Providers</h1>
            <p class="subtitle" th:text="#{providers.subtitle}">Banks and stores your cards belong to.</p>
        </div>
    </div>

    <div class="list" th:unless="${providers.isEmpty()}">
        <div class="list-row" th:each="p : ${providers}">
            <a class="list-row-body" th:href="@{/ui/cards(provider=${p.code})}" style="color: var(--text)">
                <span class="list-row-title">
                    <span th:text="${p.name}">BBVA</span>
                    <span th:if="${p.financialProviderCatalog != null}" th:text="${p.financialProviderCatalog.name}">Bank</span>
                </span>
                <svg th:replace="~{layout/app :: icon('chevron-right', 'chevron')}"></svg>
            </a>
            <form th:action="@{/ui/providers/{c}(c=${p.code})}" method="post" style="margin: 0 12px 0 0"
                  th:attr="data-confirm=#{providers.deleteConfirm}">
                <input type="hidden" name="_method" value="DELETE">
                <button type="submit" class="icon-btn danger" th:aria-label="${#messages.msg('common.delete') + ' ' + p.name}">
                    <svg th:replace="~{layout/app :: icon('close', '')}"></svg>
                </button>
            </form>
        </div>
    </div>
    <div class="card" th:if="${providers.isEmpty()}">
        <div class="empty">
            <svg th:replace="~{layout/app :: icon('bank', '')}"></svg>
            <span th:text="#{providers.empty}">No providers yet.</span>
            <button type="button" class="btn btn-tinted btn-sm" data-open-sheet="add-provider-sheet" th:text="#{providers.add}">Add provider</button>
        </div>
    </div>

    <section class="section">
        <h2 class="list-header" th:text="#{providers.catalogs}">Provider types</h2>
        <div class="list">
            <div class="list-row" th:each="cat : ${catalogs}">
                <span class="list-row-body">
                    <span class="list-row-title"><span th:text="${cat.name}">Bank</span></span>
                    <form th:action="@{/ui/providers/catalog/{id}(id=${cat.id})}" method="post" style="margin: 0"
                          th:attr="data-confirm=#{providers.catalogDeleteConfirm}">
                        <input type="hidden" name="_method" value="DELETE">
                        <button type="submit" class="icon-btn danger" th:aria-label="${#messages.msg('common.delete') + ' ' + cat.name}">
                            <svg th:replace="~{layout/app :: icon('close', '')}"></svg>
                        </button>
                    </form>
                </span>
            </div>
            <form class="list-row" th:action="@{/ui/providers/catalog}" method="post" style="margin: 0">
                <span class="list-row-body">
                    <input class="field" name="name" required th:placeholder="#{providers.newCatalog}" th:aria-label="#{providers.newCatalog}" style="height: 40px">
                    <button type="submit" class="btn btn-tinted btn-sm" th:text="#{common.add}">Add</button>
                </span>
            </form>
        </div>
        <p class="list-footer" th:text="#{providers.catalogsHelp}">Groups for providers.</p>
    </section>
</main>

<dialog class="sheet" id="add-provider-sheet" th:aria-label="#{providers.add}">
    <form th:action="@{/ui/providers}" method="post">
        <div class="sheet-head">
            <button type="button" class="btn btn-plain btn-sm" data-close-sheet th:text="#{common.cancel}">Cancel</button>
            <strong th:text="#{providers.add}">Add provider</strong>
            <button type="submit" class="btn btn-plain btn-sm" style="font-weight: 700" th:text="#{common.add}">Add</button>
        </div>
        <div class="sheet-body">
            <div>
                <label class="field-label" for="prov-name" th:text="#{providers.name}">Name</label>
                <input class="field" id="prov-name" name="name" required autocomplete="off">
            </div>
            <div>
                <label class="field-label" for="prov-cat" th:text="#{providers.catalog}">Type</label>
                <select class="field" id="prov-cat" name="catalogId" required>
                    <option th:each="cat : ${catalogs}" th:value="${cat.id}" th:text="${cat.name}">Bank</option>
                </select>
            </div>
        </div>
    </form>
</dialog>
</body>
</html>
