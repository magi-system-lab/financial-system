<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{rcv.title})}"></head>
<body class="app">
<div th:replace="~{layout/app :: nav}"></div>
<main class="app-main" th:with="open=${receivables.?[!fullyPaid]}, paid=${receivables.?[fullyPaid]}">
    <div class="nav-bar">
        <a class="btn btn-glass btn-icon" th:href="@{/ui/more}" th:aria-label="#{common.back}">
            <svg th:replace="~{layout/app :: icon('chevron-left', '')}"></svg>
        </a>
        <span></span>
        <button type="button" class="btn btn-glass btn-icon" data-open-sheet="add-sheet" th:aria-label="#{rcv.add}">
            <svg th:replace="~{layout/app :: icon('plus', '')}"></svg>
        </button>
    </div>
    <div class="title-block">
        <div>
            <h1 class="large-title" th:text="#{rcv.title}">Money lent</h1>
            <p class="subtitle" th:text="#{rcv.subtitle}">What relatives and friends still owe you.</p>
        </div>
    </div>

    <section class="card hero" th:unless="${receivables.isEmpty()}">
        <span class="hero-label" th:text="#{rcv.pending}">Still owed</span>
        <div class="hero-amount"><span th:text="${@fmt.whole(totalPending)}">$18,500</span><small th:text="${@fmt.cents(totalPending)}">.00</small></div>
        <div class="hero-sub"><span th:text="#{rcv.active(${activeCount})}">2 open loans</span></div>
    </section>

    <div class="card" th:if="${receivables.isEmpty()}">
        <div class="empty">
            <svg th:replace="~{layout/app :: icon('people', '')}"></svg>
            <span th:text="#{rcv.empty}">No loans yet.</span>
            <button type="button" class="btn btn-tinted btn-sm" data-open-sheet="add-sheet" th:text="#{rcv.add}">Lend money</button>
        </div>
    </div>

    <th:block th:each="group : ${ {open, paid} }" th:with="isOpen=${groupStat.first}">
        <section class="section" th:unless="${group.isEmpty()}">
            <h2 class="list-header" th:text="${isOpen} ? #{rcv.open} : #{rcv.paidBack}">Open</h2>
            <div class="list">
                <a class="list-row" th:each="entry : ${group}" th:href="@{/ui/receivables/{id}(id=${entry.receivable.id})}">
                    <span class="row-icon" th:classappend="${isOpen} ? 'bg-teal' : 'bg-green'">
                        <svg th:replace="~{layout/app :: icon(${isOpen} ? 'people' : 'check', '')}"></svg>
                    </span>
                    <span class="list-row-body">
                        <span class="list-row-title" style="gap: 4px">
                            <span th:text="${entry.receivable.debtorName}">Ana</span>
                            <span th:text="${entry.receivable.description != null and !entry.receivable.description.isBlank()
                                    ? entry.receivable.description + ' · ' : ''} + #{rcv.rowSub(${@fmt.money0(entry.totalRepaid)}, ${@fmt.money0(entry.receivable.principalAmount)})}">Laptop · $1,500 of $18,500 repaid</span>
                            <span th:class="${'meter' + (entry.fullyPaid ? ' meter-green' : '')}" style="margin-top: 4px">
                                <span th:style="${'width:' + #numbers.formatDecimal(entry.percentPaid, 1, 'NONE', 1, 'POINT') + '%'}"></span>
                            </span>
                        </span>
                        <span class="list-row-value tabular" th:text="${@fmt.money(entry.pendingAmount)}">$17,000.00</span>
                        <svg th:replace="~{layout/app :: icon('chevron-right', 'chevron')}"></svg>
                    </span>
                </a>
            </div>
        </section>
    </th:block>
</main>

<dialog class="sheet" id="add-sheet" th:aria-label="#{rcv.add}">
    <form th:action="@{/ui/receivables}" method="post">
        <div class="sheet-head">
            <button type="button" class="btn btn-plain btn-sm" data-close-sheet th:text="#{common.cancel}">Cancel</button>
            <strong th:text="#{rcv.add}">Lend money</strong>
            <button type="submit" class="btn btn-plain btn-sm" style="font-weight: 700" th:text="#{common.add}">Add</button>
        </div>
        <div class="sheet-body form-stack">
            <div>
                <label class="field-label" for="r-debtor" th:text="#{rcv.debtor}">Who owes you?</label>
                <input class="field" id="r-debtor" name="debtorName" required autocomplete="off">
            </div>
            <div>
                <label class="field-label" for="r-desc" th:text="#{rcv.description}">Reason or note</label>
                <input class="field" id="r-desc" name="description" autocomplete="off">
            </div>
            <div class="field-row">
                <div>
                    <label class="field-label" for="r-amount" th:text="#{rcv.amount}">Amount lent</label>
                    <input class="field tabular" id="r-amount" name="principalAmount" type="number" inputmode="decimal" step="0.01" min="0.01" required>
                </div>
                <div>
                    <label class="field-label" for="r-date" th:text="#{rcv.lentDate}">Date lent</label>
                    <input class="field" id="r-date" name="lentDate" type="date" th:value="${today}" th:max="${today}">
                </div>
            </div>
        </div>
    </form>
</dialog>
</body>
</html>
