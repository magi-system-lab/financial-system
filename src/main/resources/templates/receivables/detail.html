<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${receivable.debtorName} + ' – Receivable'">Receivable – Financial Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .chart-box { position: relative; height: 280px; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container pb-5">
    <a th:href="@{/ui/receivables}" class="text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i>Back to receivables
    </a>

    <div class="d-flex flex-wrap align-items-center gap-2 mt-2 mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person me-2 text-primary"></i>
            <span th:text="${receivable.debtorName}"></span>
        </h2>
        <span class="badge fs-6" th:classappend="${status.fullyPaid} ? 'bg-success' : 'bg-warning text-dark'"
              th:text="${status.fullyPaid} ? 'Fully Paid' : 'Pending'"></span>
        <div class="w-100 text-muted">
            <span th:if="${receivable.description}" th:text="${receivable.description}"></span>
            <span th:if="${receivable.lentDate}"
                  th:text="${(receivable.description != null ? ' · ' : '') + 'Lent on ' + #temporals.format(receivable.lentDate, 'dd MMM yyyy')}"></span>
        </div>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <div class="text-muted small">Lent</div>
                    <div class="fs-4 fw-bold" th:text="${'$' + #numbers.formatDecimal(receivable.principalAmount, 1, 'COMMA', 2, 'POINT')}"></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm border-0 h-100 bg-success-subtle">
                <div class="card-body">
                    <div class="text-muted small">Repaid</div>
                    <div class="fs-4 fw-bold" th:text="${'$' + #numbers.formatDecimal(status.totalRepaid, 1, 'COMMA', 2, 'POINT')}"></div>
                    <div class="progress mt-2" style="height: 6px;">
                        <div class="progress-bar bg-success" th:style="'width: ' + ${status.percentPaid} + '%'"></div>
                    </div>
                    <small class="text-muted" th:text="${#numbers.formatDecimal(status.percentPaid, 1, 1)} + '% paid'"></small>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm border-0 h-100 bg-primary-subtle">
                <div class="card-body">
                    <div class="text-muted small">Pending</div>
                    <div class="fs-4 fw-bold" th:text="${'$' + #numbers.formatDecimal(status.pendingAmount, 1, 'COMMA', 2, 'POINT')}"></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <div class="text-muted small">Payments</div>
                    <div class="fs-4 fw-bold" th:text="${history.paymentCount}"></div>
                    <small class="text-muted d-block" th:if="${history.paymentCount > 0}"
                           th:text="${'Avg $' + #numbers.formatDecimal(history.averagePayment, 1, 'COMMA', 2, 'POINT')}"></small>
                    <small class="text-muted d-block" th:if="${history.lastPaymentDate}"
                           th:text="${'Last: ' + #temporals.format(history.lastPaymentDate, 'dd MMM yyyy')
                                    + ' (' + history.daysSinceLastPayment + ' days ago)'}"></small>
                </div>
            </div>
        </div>
    </div>

    <!-- Register payment -->
    <div class="card shadow-sm mb-4" th:unless="${status.fullyPaid}">
        <div class="card-header bg-white">
            <h6 class="mb-0 fw-semibold"><i class="bi bi-cash-coin me-2"></i>Register Payment</h6>
        </div>
        <div class="card-body">
            <form th:action="@{/ui/receivables/{id}/payment(id=${receivable.id})}" method="post">
                <input type="hidden" name="returnTo" value="detail">
                <div class="row g-2">
                    <div class="col-sm-3">
                        <label class="form-label small text-muted mb-1">Amount</label>
                        <input type="number" name="amount" step="0.01" min="0.01" class="form-control" required>
                    </div>
                    <div class="col-sm-3">
                        <label class="form-label small text-muted mb-1">Date received</label>
                        <input type="date" name="paymentDate" class="form-control" th:value="${today}" th:max="${today}" required>
                    </div>
                    <div class="col-sm-5">
                        <label class="form-label small text-muted mb-1">Note</label>
                        <input type="text" name="note" class="form-control" placeholder="e.g. transfer, cash, covers Mar–Apr">
                    </div>
                    <div class="col-sm-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100"><i class="bi bi-plus-lg"></i></button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Charts -->
    <div class="row g-3 mb-4" th:if="${history.paymentCount > 0}">
        <div class="col-lg-7">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white">
                    <h6 class="mb-0 fw-semibold"><i class="bi bi-graph-down me-2"></i>Balance over time</h6>
                </div>
                <div class="card-body">
                    <div class="chart-box"><canvas id="balanceChart"></canvas></div>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white">
                    <h6 class="mb-0 fw-semibold"><i class="bi bi-bar-chart me-2"></i>Repaid per month</h6>
                </div>
                <div class="card-body">
                    <div class="chart-box"><canvas id="monthlyChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <!-- History -->
    <div class="card shadow-sm" th:if="${history.paymentCount > 0}">
        <div class="card-header bg-white">
            <h6 class="mb-0 fw-semibold"><i class="bi bi-clock-history me-2"></i>Payment history</h6>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Date received</th>
                    <th class="text-end">Amount</th>
                    <th>Note</th>
                    <th class="text-end">Repaid so far</th>
                    <th class="text-end">Remaining</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row, it : ${history.entries}" th:with="entry=${history.entries[history.entries.size() - 1 - it.index]}">
                    <td class="text-muted" th:text="${history.entries.size() - it.index}"></td>
                    <td th:text="${#temporals.format(entry.paymentDate, 'dd MMM yyyy')}"></td>
                    <td class="text-end fw-semibold text-success" th:text="${'$' + #numbers.formatDecimal(entry.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${entry.note}"></td>
                    <td class="text-end" th:text="${'$' + #numbers.formatDecimal(entry.cumulativeRepaid, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-end" th:text="${'$' + #numbers.formatDecimal(entry.remainingBalance, 1, 'COMMA', 2, 'POINT')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="alert alert-info" th:if="${history.paymentCount == 0}">
        <i class="bi bi-info-circle me-2"></i>No payments registered yet.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    const balanceLabels = /*[[${balanceLabels}]]*/ [];
    const balanceValues = /*[[${balanceValues}]]*/ [];
    const repaidValues  = /*[[${repaidValues}]]*/ [];
    const monthLabels   = /*[[${monthLabels}]]*/ [];
    const monthAmounts  = /*[[${monthAmounts}]]*/ [];

    const money = v => '$' + Number(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

    const balanceCanvas = document.getElementById('balanceChart');
    if (balanceCanvas) {
        new Chart(balanceCanvas, {
            type: 'line',
            data: {
                labels: balanceLabels,
                datasets: [
                    {label: 'Remaining', data: balanceValues, stepped: true, fill: true,
                     borderColor: '#0d6efd', backgroundColor: 'rgba(13,110,253,0.12)'},
                    {label: 'Repaid so far', data: repaidValues, stepped: true,
                     borderColor: '#198754', backgroundColor: '#198754'}
                ]
            },
            options: {
                maintainAspectRatio: false,
                interaction: {mode: 'index', intersect: false},
                scales: {y: {beginAtZero: true, ticks: {callback: money}}},
                plugins: {tooltip: {callbacks: {label: c => c.dataset.label + ': ' + money(c.parsed.y)}}}
            }
        });
    }

    const monthlyCanvas = document.getElementById('monthlyChart');
    if (monthlyCanvas) {
        new Chart(monthlyCanvas, {
            type: 'bar',
            data: {
                labels: monthLabels,
                datasets: [{label: 'Repaid', data: monthAmounts, backgroundColor: '#198754'}]
            },
            options: {
                maintainAspectRatio: false,
                scales: {y: {beginAtZero: true, ticks: {callback: money}}},
                plugins: {legend: {display: false},
                          tooltip: {callbacks: {label: c => money(c.parsed.y)}}}
            }
        });
    }
</script>
</body>
</html>
