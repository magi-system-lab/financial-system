<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout/app :: head(#{result.title})}"></head>
<body class="app">
<div th:replace="~{layout/app :: nav}"></div>
<main class="app-main">
    <div class="empty" style="color: var(--text)">
        <span class="row-icon bg-green" style="width: 72px; height: 72px; border-radius: 36px">
            <svg th:replace="~{layout/app :: icon('check', '')}"></svg>
        </span>
        <h1 class="large-title" style="font-size: 28px" th:text="#{result.title}">Import complete</h1>
        <p class="subtitle" th:text="#{result.summary(${result.count(T(com.jimm0063.magi.debt.management.debtmanagementltesystem.domain.model.BulkSyncResult.Outcome).APPLIED)}, ${result.count(T(com.jimm0063.magi.debt.management.debtmanagementltesystem.domain.model.BulkSyncResult.Outcome).NO_CHANGES)}, ${result.count(T(com.jimm0063.magi.debt.management.debtmanagementltesystem.domain.model.BulkSyncResult.Outcome).SKIPPED)}, ${result.count(T(com.jimm0063.magi.debt.management.debtmanagementltesystem.domain.model.BulkSyncResult.Outcome).FAILED)})}">2 applied · 1 up to date · 0 skipped · 0 failed</p>
    </div>

    <div class="list">
        <div class="list-row" th:each="e : ${result.entries()}">
            <span class="list-row-body" style="padding-top: 12px; padding-bottom: 12px">
                <span class="list-row-title" style="gap: 3px">
                    <a th:if="${!e.debtAccountCode().isEmpty()}" th:href="@{/ui/debt-accounts/{c}(c=${e.debtAccountCode()})}"
                       style="color: var(--text)" th:text="${e.accountName() != null ? e.accountName() : e.debtAccountCode()}">Visa Oro</a>
                    <span th:if="${e.debtAccountCode().isEmpty()}">—</span>
                    <span th:text="${e.fileName()}">statement.pdf</span>
                    <span th:if="${e.outcome().name() == 'APPLIED'}" th:text="#{result.counts(${e.inserted()}, ${e.updated()}, ${e.deactivated()})}">+2 new · 3 updated · −0 deactivated</span>
                    <span th:if="${e.note() != null}" th:text="${e.note()}">note</span>
                </span>
                <span th:switch="${e.outcome().name()}">
                    <span th:case="'APPLIED'" class="chip chip-green" th:text="#{result.applied}">Applied</span>
                    <span th:case="'NO_CHANGES'" class="chip chip-blue" th:text="#{result.upToDate}">Up to date</span>
                    <span th:case="'SKIPPED'" class="chip chip-gray" th:text="#{result.skipped}">Skipped</span>
                    <span th:case="'FAILED'" class="chip chip-red" th:text="#{result.failed}">Failed</span>
                </span>
            </span>
        </div>
    </div>

    <div class="actions-grid">
        <a class="btn btn-tinted" th:href="@{/ui/bulk-statements}" th:text="#{result.again}">New import</a>
        <a class="btn btn-primary" th:href="@{/ui/insights}" th:text="#{result.insights}">See Insights</a>
    </div>
</main>
</body>
</html>
