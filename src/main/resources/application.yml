spring:
  datasource:
    url: ${SPRING_DB_URL}
    username: ${SPRING_DB_USER}
    password: ${SPRING_DB_PASSWORD}
    driver-class-name: ${SPRING_DB_DRIVE:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: ${SPRING_DB_SCHEMA:public}
  data:
    rest:
      base-path: /data
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  thymeleaf:
    cache: false
  web:
    resources:
      # Fingerprinted URLs (app-<hash>.css) via @{...} in templates, so static files can be cached for a week.
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/img/**
      cache:
        cachecontrol:
          max-age: 7d
  servlet:
    multipart:
      max-file-size: 50MB
      # Bulk statement import sends several statements in one request.
      max-request-size: 300MB
server:
  port: 666
  mime-mappings:
    # Web app manifest for "Add to Home Screen".
    webmanifest: application/manifest+json
  tomcat:
    # Each bulk-import file adds ~3 multipart parts (file, card, password); Tomcat's default is 50.
    max-part-count: 500

app:
  default-user-email: ${APP_DEFAULT_USER_EMAIL:jimm0063@icloud.com}
