<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Offline · Financial Manager</title>
    <style>
        :root { color-scheme: light dark; --bg: #F2F2F7; --card: #FFFFFF; --text: #000; --text-2: #6C6C70; --accent: #0066D6; }
        @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1C1C1E; --text: #FFF; --text-2: #AEAEB2; --accent: #0070E0; } }
        body {
            margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
            background: var(--bg); color: var(--text); text-align: center;
            font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            padding: 24px; box-sizing: border-box;
        }
        main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        svg { width: 56px; height: 56px; fill: none; stroke: var(--text-2); stroke-width: 1.5; stroke-linecap: round; }
        h1 { margin: 6px 0 0; font-size: 24px; }
        p { margin: 0; color: var(--text-2); font-size: 15px; }
        button {
            margin-top: 12px; height: 50px; padding: 0 28px; border: 0; border-radius: 25px;
            background: var(--accent); color: #FFF; font: inherit; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M14 10.3A10 10 0 0 1 19 13M2 9.5a15 15 0 0 1 4.6-2.9M10.8 5.1A15 15 0 0 1 22 9.5M12 20h.01"/></svg>
    <h1>You’re offline</h1>
    <p>This page hasn’t been saved on this device yet. Open it once while connected and it will be available offline.</p>
    <p lang="es">Sin conexión: esta página aún no está guardada en este dispositivo.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
